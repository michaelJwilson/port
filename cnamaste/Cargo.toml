[package]
name = "oxicnamaste"
# Single source of the version: `pyproject.toml` sets `dynamic = ["version"]`
# and maturin reads it from here, as `port` does with `oxiport`.
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/michaelJwilson/port"

[lib]
# Matches `module-name = "cnamaste.oxicnamaste"` in pyproject.toml and the
# `#[pymodule]` below; "rlib" lets benches and tests link it as Rust.
name = "oxicnamaste"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
