# `cnaster` at 4adad4d, renamed `cnamaste` (VENDOR.toml, #392). The runtime
# dependencies are the pin's, unchanged; its development extras are not
# carried; its own tests take `test` below. `snakes_and_ladders` joins the
# runtime dependencies at stage 3 (#392).
[project]
name = "cnamaste"
version = "0.1.0"
description = "cnaster at the pin port locks, with port's default patches folded in"
authors = [{ name = "M. J. Wilson", email = "mjwilson@princeton.edu" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.2"
readme = "README.md"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pandas>=2.0.0,<3",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "numba>=0.61.0",
    "rich==14.0.0",
    "polars>=1.30.0",
    "pyyaml>=6.0",
    "pybedtools",
    "pyranges",
    "hmmlearn",
    "pysam",
    # `hmm_nophasing`'s per-clone shift lays its segments out with
    # `snakes_and_ladders.ragged.Ragged` (#276, #392).
    "snakes_and_ladders",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-benchmark>=4", "pytest-xdist>=3.6"]

[project.scripts]
run_cnamaste = "cnamaste.scripts.run_cnamaste:main"

[tool.hatch.build.targets.wheel]
include = ["python/cnamaste"]

[tool.hatch.build.targets.wheel.sources]
"python/cnamaste" = "cnamaste"

[tool.uv.sources]
snakes_and_ladders = { git = "https://github.com/michaelJwilson/snakes_and_ladders", branch = "main" }

# `cnamaste`'s own tests (#392): fixture based, and blind to `cnaster` and
# `snakes_and_ladders` -- the generator in `tests/sim` is `numpy` alone.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-m", "not release", "--benchmark-disable"]
markers = [
    "end2end: judged against the planted truth, through a whole run",
    "oracle: judged against an independent implementation of the same quantity",
    "analytic: judged against a mathematical property",
    "sim: judges the generator against what it planted",
    "benchmark: records a baseline; asserts no ratio",
    "release: over the per-PR budget, or a stress size; run with -m release",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
