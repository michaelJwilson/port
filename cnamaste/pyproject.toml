# `cnaster` at 4adad4d, renamed `cnamaste` (VENDOR.toml, #392). The runtime
# dependencies are the pin's, unchanged; its development extras are not
# carried, because `port` develops and tests the copy.
[project]
name = "cnamaste"
version = "0.1.0"
description = "cnaster at the pin port locks, with port's default patches folded in"
authors = [{ name = "M. J. Wilson", email = "mjwilson@princeton.edu" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.2"
readme = "README.md"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pandas>=2.0.0,<3",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "numba>=0.61.0",
    "rich==14.0.0",
    "polars>=1.30.0",
    "pyyaml>=6.0",
    "pybedtools",
    "pyranges",
    "hmmlearn",
    "pysam",
]

[project.scripts]
run_cnamaste = "cnamaste.scripts.run_cnamaste:main"

[tool.hatch.build.targets.wheel]
include = ["python/cnamaste"]

[tool.hatch.build.targets.wheel.sources]
"python/cnamaste" = "cnamaste"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
