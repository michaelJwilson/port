# The population study's draw (#544): one seed is one member.
# `python -m tests.studies.population` sets `[sample] seed` per member; the
# tree, the events, the layout and the counts are all drawn from it, so a
# clone's size and an event's length vary across members.
version = 3
extends = "calicost_grch38.toml"

[sample]
name = "population"
seed = 0
output = "../generated"
realizations = 1

[array]
# NB one CalicoST slice, 60 rows of 50 (3,000 spots).
kind = "hex"
rows = 60
columns = 50

[layout]
overlap = false
radius = 0.2
vertices = 6

[layout.size]
# NB even in log spots, so every log-UMI bin is populated; 25 spots is about
#    8e4 UMIs at the fitted spot law, 1,000 about 3e6. Three clones of up to
#    1,000 spots fit on 3,000 without overlap.
law = "loguniform"
minimum = 25
maximum = 1000

[cna]
mode = "tree"
# NB a clone carries 1 + 3 + (0 or 1) events: enough per member for the
#    length curve without covering the genome.
trunk = 1
per_leaf = 3
per_internal = 1

[cna.length]
law = "exponential"
# NB mean 20 Mb, floor 1 Mb (about one bin), so the short end is populated.
mean = 2e7
minimum = 1e6

[phasing]
switch_errors = true

[[slice]]
offset = [0.0, 0.0]
clones = ["clone_0", "clone_1", "clone_2"]
