# The population study's draw (#544): one seed is one member.
# `python -m tests.studies.population` sets `[sample] seed` per member; the
# tree, the events, the layout and the counts are all drawn from it, so a
# clone's size and an event's length vary across members.
version = 3
extends = "calicost_grch38.toml"

[sample]
name = "population"
seed = 0
output = "../generated"
realizations = 1

[array]
# NB one CalicoST slice, 60 rows of 50 (3,000 spots).
kind = "hex"
rows = 60
columns = 50

[model]
# NB the Polya urn: the gamma draw's law at O(UMIs) per spot (#549), since
#    a member is drawn once and run at every J.
counts_sampler = "urn"

[layout]
overlap = false
radius = 0.2
vertices = 6

[layout.size]
# NB even in log spots around the detection threshold the pilot found
#    (#544: about 10^6 UMIs, 300 spots, at J = 0.8): 100 spots is about
#    3e5 UMIs at the fitted spot law, 1,000 about 3e6. Three clones of up
#    to 1,000 spots fit on 3,000 without overlap.
law = "loguniform"
minimum = 100
maximum = 1000

[cna]
mode = "tree"
# NB a clone carries 1 + 4 + (0 or 1) events: enough per member for the
#    length curve without covering the genome.
trunk = 1
per_leaf = 4
per_internal = 1
# NB each of Study 2's classes a third of the draws: LOH (loss and
#    copy-neutral), balanced gain, imbalanced gain. A state is drawn
#    uniformly by index, so repeating (2, 2) weights it.
states = [
    [1, 0], [0, 1], [2, 0], [0, 2],
    [2, 2], [2, 2], [2, 2], [2, 2],
    [2, 1], [1, 2], [3, 1], [1, 3],
]

[cna.length]
law = "exponential"
# NB mean 20 Mb, floor 1 Mb (about one bin), so the short end is populated.
mean = 2e7
minimum = 1e6

[phasing]
switch_errors = true

[[slice]]
offset = [0.0, 0.0]
clones = ["clone_0", "clone_1", "clone_2"]
