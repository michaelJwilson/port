# The population study's long-event arm (#544): `population.toml` with a
# 60 Mb median event length, for Study 2's long-length bins only. Study 2 reads
# recovery given length and class, which the length law does not change;
# Study 1 reads the base population alone, since longer events alter more of
# each clone's genome.
version = 3
extends = "population.toml"

[sample]
name = "population_long"

[cna.length]
# NB lognormal at a 60 Mb median, as `population.toml` at 20 Mb (T- #807); exponential at a
#    60 Mb mean until then.
law = "lognormal"
median = 6e7
sigma = 0.541
minimum = 1e6
