# `study15.toml` on two samples (T- #807): two slices of one tissue overlapping by half an array.
# The truth is drawn on the slices' shared space -- every clone, listed by "all", centred
# anywhere either slice covers -- and each slice's counts are realized on its own spots.
# For figures; the studies read the one slice.
version = 3
extends = "study15.toml"

[sample]
name = "study15_2s"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here (`tests/test_sim_r0_hash.py`).
r0_hash = "ed6f692f"

[[slice]]
offset = [0.0, 0.0]
clones = "all"

[[slice]]
offset = [0.5, 0.0]
clones = "all"
