# dev_tree on one slice (#556): the three tumour clones and normal on one 60 x 50 array.
# `python -m port.sim.draw sim/manifests/dev_tree_1s.toml`
version = 3
extends = "calicost_grch38.toml"

[sample]
name = "dev_tree_1s"
seed = 0
output = "../generated"
# NB count draws of the same clones, layout and phase, written as r0, r1, ...
realizations = 5

[array]
kind = "hex"
rows = 60
columns = 50

[model]
# NB CalicoST's BAF overdispersion by moments (#556): normal spots 0.013 (easy) and
#    0.020 (hard), tumour clones -0.004 to 0.018 at their fitted tumour fractions, each +- 0.010; pooled 0.009
bb_overdispersion = 0.01

[layout]
overlap = false
radius = 0.4
vertices = 6

[cna]
mode = "tree"
per_internal = 1

[cna.length]
law = "exponential"
mean = 5e7
minimum = 5e6

[phasing]
switch_errors = true

[[slice]]
offset = [0.0, 0.0]
clones = ["clone_0", "clone_1", "clone_2"]
