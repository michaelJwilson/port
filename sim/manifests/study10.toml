# `study15.toml` at a 10 Mb CNA length median, CalicoST hard's event length (T- #807): at r0 the
# run's clone field misplaces 42% of spots by argmax, against CalicoST hard's 45%.
version = 3
extends = "study15.toml"

[sample]
name = "study10"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here (`tests/test_sim_r0_hash.py`).
r0_hash = "cde71315"

[cna.length]
law = "lognormal"
median = 1e7
sigma = 0.541
minimum = 1e6
