# The studies' one draw (T- #807): the Potts stream, the copy-state stream and the population
# study each read it. One seed is one member; `vary = "truth"` gives each realization after r0
# its own tree, clone sizes and layout, so a stream's held-out and evaluated problems differ in
# truth, and a population member is r0 of its own seed.
version = 3
extends = "calicost_grch38.toml"

[sample]
name = "study"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here (`tests/test_sim_r0_hash.py`).
r0_hash = "74439768"
seed = 0
output = "../generated"
# NB one per draw: `port.studies.population.draw_member` draws r0 of each seed, and a stream's
#    `port.studies.stage.members` sets the count it reads.
realizations = 1
vary = "truth"

[array]
# NB one CalicoST slice, 60 rows of 50 (3,000 spots).
kind = "hex"
rows = 60
columns = 50

[model]
# NB the Polya urn: the gamma draw's law at O(UMIs) per spot (#549).
counts_sampler = "urn"
# NB CalicoST's BAF overdispersion by moments (#556).
bb_overdispersion = 0.01
# NB CalicoST hard's tumour share, fitted per spot at its planted states: 0.835-0.910 by clone,
#    mean normal fraction 0.14 (#556); T- #809 records a reported admixture bug, not reproduced.
admixture = "cell"
normal_frac = 0.14

[layout]
overlap = false
radius = 0.2
vertices = 6
# NB a clone that 10 centres do not clear ends the layout: the truth is drawn on the clones
#    placed before it (T- #807)
max_placements = 10
unplaced = "stop"

[layout.size]
# NB the UMIs per clone the population study sweeps, about the detection threshold (#544:
#    about 10^6 UMIs, 300 spots, at J = 0.8). Lognormal at the log-centre and log-spread of
#    a log-uniform over 200-2,000 spots: median sqrt(200 x 2,000) = 632, sigma ln(10) / sqrt(12)
#    = 0.665 (T- #807). A clone the edge does not clip claims its target; 632 spots is about
#    2e6 UMIs at the fitted spot law.
law = "lognormal"
median = 632
sigma = 0.665
# NB a clone is sized on the array continued past its edge: one that runs off it keeps only
#    the spots, and so the UMIs, that land on it (T- #807)
edge = "clip"

[cna]
mode = "tree"
# NB tumour clones per truth: Poisson at mean 3, zero-truncated (T- #807): mean 3.16, P(1) = 0.16.
#    The run's `hmrf.n_clones` stays the configuration's, whatever the draw gives.
n_clones = { law = "poisson", mean = 3, minimum = 1 }
# NB a clone carries 1 + 4 + (0 or 1) events: enough per member for the length curve
#    without covering the genome.
trunk = 1
per_leaf = 4
per_internal = 1
# NB required of a new manifest (T- #698)
loh = "irreversible"
# NB every (A, B) up to a total of 6, uniform (T- #807): 26 states, (1, 1) left out as no
#    event and (0, 0) as no reads to score.
states = [
    [0, 1], [1, 0],
    [0, 2], [2, 0],
    [0, 3], [1, 2], [2, 1], [3, 0],
    [0, 4], [1, 3], [2, 2], [3, 1], [4, 0],
    [0, 5], [1, 4], [2, 3], [3, 2], [4, 1], [5, 0],
    [0, 6], [1, 5], [2, 4], [3, 3], [4, 2], [5, 1], [6, 0],
]

[cna.length]
# NB lognormal at a 20 Mb median, floored at 1 Mb (about one bin); 10% of events below half
#    the median: port.sim.laws.lognormal_sigma(0.10, 0.5).
law = "lognormal"
median = 2e7
sigma = 0.541
minimum = 1e6

[phasing]
switch_errors = true

[[slice]]
offset = [0.0, 0.0]
clones = "all"
