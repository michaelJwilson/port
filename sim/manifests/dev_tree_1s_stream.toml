# The solver streams' draw (T- #807): `dev_tree_1s_hard` at a lognormal median of 20 Mb,
# the population study's length law, each realization its own truth.
# `run_calibrate --potts|--copy` and `run_study --potts-stream|--copy-state-stream` read it.
version = 3
extends = "dev_tree_1s_hard.toml"

[sample]
name = "dev_tree_1s_stream"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here (`tests/test_sim_r0_hash.py`).
r0_hash = "9adc1ab0"
# NB each realization after r0 draws its own tree, clone sizes and layout, so the held-out
#    and evaluated problems differ in truth, not only in counts (#800).
vary = "truth"

[cna]
# NB required of a new manifest (T- #698)
loh = "irreversible"

[cna.length]
# NB lognormal at a 20 Mb median, floored at 1 Mb; 10% of events below half the median:
#    port.sim.laws.lognormal_sigma(0.10, 0.5)
law = "lognormal"
median = 2e7
sigma = 0.541
minimum = 1e6
