# dev_tree_1s with CalicoST easy's CNA law and admixture (#556): its clone field matched to CalicoST's.
version = 3
extends = "dev_tree_1s.toml"

[sample]
name = "dev_tree_1s_easy"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here: a change to this
#    manifest or to the simulator that moves it states the new one, so the hash
#    names the generation (`tests/test_sim_r0_hash.py`).
r0_hash = "0330bc21"

[model]
# NB CalicoST's tumour share, fitted per spot at its planted states: 0.835-0.910 by clone,
#    mean normal fraction 0.14 (#556)
admixture = "cell"
normal_frac = 0.14

[cna]
# NB CalicoST's shared + local events, 1 shared and 2 per clone
mode = "shared.unique"
shared = 1
unique = 2

[cna.length]
# NB exponential about CalicoST's fixed 50 Mb, floored at 1 Mb
law = "exponential"
mean = 5e7
minimum = 1e6

[phasing]
# NB CalicoST writes A/B phased by haplotype
switch_errors = false
