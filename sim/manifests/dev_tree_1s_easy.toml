# dev_tree_1s with CalicoST easy's CNA law and admixture (#556): its clone field matched to CalicoST's.
version = 3
extends = "dev_tree_1s.toml"

[sample]
name = "dev_tree_1s_easy"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here: a change to this
#    manifest or to the simulator that moves it states the new one, so the hash
#    names the generation (`tests/test_sim_r0_hash.py`).
#    Exponential lengths, to #619: 0330bc21. Lognormal lengths, shared.unique
#    clones, to T- #660: 22a5eb85.
r0_hash = "7ba9b01f"

[model]
# NB CalicoST's tumour share, fitted per spot at its planted states: 0.835-0.910 by clone,
#    mean normal fraction 0.14 (`tests.studies.field_strength calicost`)
admixture = "cell"
normal_frac = 0.14

[cna]
# NB a binary clone tree (T- #660): topology uniform over the 3 rooted binary
#    trees on its 3 clones (Felsenstein 1978), Poisson events per edge with
#    7 expected in all, CalicoST's `numcnas1.2` count (1 shared + 3 x 2 unique).
#    `n_clones = 3` is the leaves; the inherited shared, unique, trunk,
#    per_leaf and per_internal are not read.
mode = "felsenstein"
expected_cnas = 7

[cna.length]
# NB lognormal about CalicoST's fixed 50 Mb, floored at 1 Mb (#619)
law = "lognormal"
mean = 5e7
# NB 10% of events below half the median: port.sim.laws.lognormal_sigma(0.10, 0.5)
sigma = 0.541
minimum = 1e6

[phasing]
# NB CalicoST writes A/B phased by haplotype
switch_errors = false
