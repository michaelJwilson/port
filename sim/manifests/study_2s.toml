# `study.toml` on two samples (T- #810): the same draw, two slices of one tissue overlapping
# by half an array, `clone_1` on both and placed where they overlap, its `[layout.size]`
# target counted over both. For figures; the studies read `study.toml`'s one slice.
version = 3
extends = "study.toml"

[sample]
name = "study_2s"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here (`tests/test_sim_r0_hash.py`).
r0_hash = "0abf60fc"

[[slice]]
offset = [0.0, 0.0]
clones = ["clone_0", "clone_1"]

[[slice]]
offset = [0.5, 0.0]
clones = ["clone_1", "clone_2"]
