# dev_tree_1s with CalicoST hard's CNA law and admixture (#556): its clone field matched to CalicoST's.
version = 3
extends = "dev_tree_1s.toml"

[sample]
name = "dev_tree_1s_hard"
# NB `tests.sim_stages.realization_hash` of r0 as drawn here: a change to this
#    manifest or to the simulator that moves it states the new one, so the hash
#    names the generation (`tests/test_sim_r0_hash.py`).
#    At 8189d19's mean of 1e7, r0 hashed to 7328c0d6; exponential at median 1e7, ed2fcda1.
r0_hash = "9ec90dc2"
# NB the solver streams' manifest: each realization after r0 draws its own tree, clone
#    sizes and layout, so their held-out and evaluated problems differ in truth, not only
#    in counts (#800); r0 is the `counts` r0, so its hash is unchanged.
vary = "truth"

[model]
# NB CalicoST's tumour share, fitted per spot at its planted states: 0.835-0.910 by clone,
#    mean normal fraction 0.14 (`tests.studies.field_strength calicost`)
admixture = "cell"
normal_frac = 0.14

[cna]
# NB CalicoST's shared + local events, 6 shared and 3 per clone
mode = "shared.unique"
shared = 6
unique = 3

[cna.length]
# NB lognormal at CalicoST's fixed 10 Mb as the median (#581), floored at 1 Mb (#619)
law = "lognormal"
median = 1e7
# NB 10% of events below half the median: port.sim.laws.lognormal_sigma(0.10, 0.5)
sigma = 0.541
minimum = 1e6

[phasing]
# NB CalicoST writes A/B phased by haplotype
switch_errors = false
