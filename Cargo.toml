[package]
name = "oxiport"
# Single source of truth for the version: pyproject.toml sets
# `dynamic = ["version"]`, so maturin reads it from here and the two files
# cannot silently drift apart.
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/michaelJwilson/port"

[lib]
# The crate name must match the last component of `module-name` in
# pyproject.toml (`port.oxiport`) and the `#[pymodule]` function in
# src/lib.rs.
name = "oxiport"
# "rlib" (alongside "cdylib") lets benches/ and tests/ link this crate
# normally as a Rust library; "cdylib" alone is only linkable by Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
# The first binding to take an array arrived with #184. `rust-numpy` is the
# PyO3 project's own array bridge (BSD-2-Clause, ~1.2k stars) and is versioned
# against the `pyo3` above, so the pair moves together or not at all.
numpy = "0.29"
# Data parallelism for the two kernels' folds. Apache-2.0/MIT, ~11k stars, and
# a rust-lang project. It is the whole of the crate's threading: each kernel
# validates, releases the GIL, and folds, so nothing here manages a pool.
rayon = "1"
