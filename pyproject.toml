[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "port"
dynamic = ["version"]
description = ""
authors = [{ name = "M. J. Wilson" }]
license = "MIT"
requires-python = ">=3.12.2"
readme = "README.md"
dependencies = [
    "matplotlib>=3.9.0",
    "numba>=0.61.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
snakes_and_ladders = { git = "https://github.com/michaelJwilson/snakes_and_ladders", branch = "main" }

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9,<0.10",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7",
    "towncrier>=24.8.0",
    "types-PyYAML>=6.0",
]
docs = [
    "sphinx>=7,<9",
]
notebooks = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4",
    "pytest-xdist>=3.6",
]

[tool.maturin]
python-source = "python"
module-name = "port.oxiport"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "G004", # f-string in logger
  "T201", # print statements
  "PLR2004", # magic value in assert
  "ANN",  # annotation presence is enforced by mypy --strict, not ruff
]

extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
]
extend-ignore = [
  "PLR09",    # Too many <...>
  "ISC001",   # Conflicts with formatter
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # literal expected values are the point of a regression test
]

[tool.mypy]
strict = true
files = ["python", "tests", "infra"]
mypy_path = "infra"

[[tool.mypy.overrides]]
module = "pytest_benchmark.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "check_notebooks"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
ignore_missing_imports = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["port"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
