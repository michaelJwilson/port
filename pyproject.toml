[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "port"
dynamic = ["version"]
description = ""
authors = [{ name = "M. J. Wilson" }]
license = "MIT"
requires-python = ">=3.12.2"
readme = "README.md"
dependencies = [
    "matplotlib>=3.9.0",
    "numba>=0.61.0",
    "numpy>=1.26.0",
    # Already installed -- `cnaster` requires it and reads the Visium HD
    # spatial parquet with it -- and declared here because `port` now imports
    # it directly. MIT, ~35k stars. #185 carries the measurement: 13.3x and
    # 55.2 MB -> 23.3 MB on the reference-gene read at a human reference's
    # size.
    "polars>=1.0",
    # What makes `polars` and `pandas` one conversion rather than six. Without
    # it `DataFrame.to_pandas()` raises and the frame is rebuilt column by
    # column through `numpy`; with it the numeric columns cross by Arrow
    # buffer. Apache-2.0, ~15k stars on `apache/arrow` -- neither the licence
    # rule nor the star bar is in question. **It is a real install**, unlike
    # `polars`: the resolution goes 193 packages to 194 and the wheel is the
    # largest in the environment, which is the cost #185 weighs against the
    # conversion it removes.
    "pyarrow>=17.0",
    "pyyaml>=6.0.3",
    # Pulled from git, not PyPI -- see [tool.uv.sources] below, which pins it
    # to the `main` branch. Declaring it here is what makes that source entry
    # take effect; without it uv silently ignores the entry.
    "snakes_and_ladders",
    # Pulled from git, not PyPI -- see [tool.uv.sources] below, which pins it
    # to the `port` branch (#259).
    "cnaster",
]

[project.scripts]
# `cnaster`'s own pipeline with `port`'s replacements rebound into it -- the
# table is `port.pipeline.SWAPS` and `--no-patch` is the baseline arm. It is
# how the whole-run claim is measured, so it ships rather than living in a
# scratch script.
run_cnaster_port = "port.scripts.run_cnaster:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9,<0.10",
    "mypy>=1.15,<3",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7",
    "towncrier>=24.8.0",
    "types-PyYAML>=6.0",
]
docs = [
    "sphinx>=7,<9",
]
# The third reference, read rather than run (#131). CalicoST is what `cnaster`
# was rewritten from, so it is the only source that says which divergences
# were decisions -- `docs/audit-*-calicost.md` are what it is for.
#
# **Optional, and the reason is measured.** Its `setup.py` pins
# `numpy==1.24.4`, `scipy==1.11.3`, `numba==0.60.0` and `matplotlib==3.7.3`
# against this project's `numpy>=1.26`, `numba>=0.61` and `matplotlib>=3.9`.
# Those pins turn out to be dead metadata: its `pyproject.toml` carries a
# PEP 621 `[project]` table with unpinned versions, which takes precedence,
# so `uv lock` resolves in 12.5 s and adds two packages -- `calicost` and
# `ete3`. It is an extra because nothing in the default path imports it and
# `ete3` is a phylogenetics dependency this repository has no use for, not
# because it could not resolve.
#
# OSI licence: BSD (its `pyproject.toml` classifier). Under 1,000 GitHub
# stars, flagged as `CLAUDE.md` requires.
calicost = [
    "calicost",
]
# The run store behind `snakes_and_ladders.track`, which is the seam #251
# records `run_cnaster`'s optimizations through. **Optional, and never
# imported at module scope**: `track.Run` is a `runtime_checkable` Protocol
# written with `aim.Run`'s own signatures, so the recording path works, types
# and tests without `aim` installed, and only a reader who wants the UI
# installs it. Mirrors how `snakes_and_ladders` declares it (sal #778).
#
# Apache-2.0 and above the 1,000-star bar, so neither `CLAUDE.md` dependency
# rule is triggered by the licence or the size. **Two advisories are, and
# they have no fixed version**: PYSEC-2026-1087 (XSS in the report endpoint)
# and PYSEC-2026-1088 (a sandbox escape in the query handler). Both are in
# the server `aim up` runs, not in the recording path this repository uses.
#
# **It is a large install.** The resolution goes 194 packages to 219: `aim`
# carries the server behind `aim up` -- `sqlalchemy`, `starlette`,
# `uvicorn`, `watchdog`, `websockets` and the rest -- none of which the
# recording path touches. That is the cost #251 weighs, and the second
# reason this is an extra.
#
# CI syncs `--extra dev --extra test`, so `aim` is never installed there.
# `uv sync --locked --all-extras` -- the command `CLAUDE.md` names -- **does**
# install it, so a `pip-audit` after that command reports both advisories.
# That is a consequence of adding it, stated rather than discovered: the
# remedy is to sync without this extra before auditing, and the reason to
# keep it an extra rather than a core dependency.
track = [
    "aim>=3.29,<4",
]
notebooks = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4",
    "pytest-xdist>=3.6",
]

[tool.uv.sources]
snakes_and_ladders = { git = "https://github.com/michaelJwilson/snakes_and_ladders", branch = "main" }
cnaster = { git = "https://github.com/michaelJwilson/cnaster", branch = "port" }
# Pinned to a commit rather than a branch: this is a reference being read, so
# a moving target would silently change what the audits describe.
calicost = { git = "https://github.com/raphael-group/CalicoST", rev = "c1abcae" }

[tool.maturin]
python-source = "python"
module-name = "port.oxiport"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "G004",     # f-string in logger
  "T201",     # print statements
  "PLR2004",  # magic value in assert
  "ANN",      # annotation presence is enforced by mypy --strict, not ruff
  "PLR09",    # Too many <...>
  "ISC001",   # Conflicts with formatter
]

extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # literal expected values are the point of a regression test
  "ARG001",  # a fixture requested for its side effect is an unused argument
]

[tool.mypy]
strict = true
files = ["python", "tests"]

[[tool.mypy.overrides]]
module = "pytest_benchmark.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `@njit` erases the signature it decorates, so a patch kernel cannot be
# annotated in a way --strict accepts. These are pinned bitwise against
# cnaster instead, which is a stronger claim than a type.
module = "port.patch.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# cnaster ships no py.typed marker, so --strict refuses every import of it.
# Narrowed to that package rather than relaxed globally: the tests score
# cnaster against a typed upstream, and silencing the upstream's types too
# would lose the half that is checkable.
module = "cnaster.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `scanpy` is `cnaster`'s dependency and ships no py.typed marker. Read here
# by one function, `_spaceranger_counts`, which reads the counts file itself
# because the cost this patch removes is inside `cnaster`'s reader (#186).
module = "scanpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `scikit-learn` is `cnaster`'s dependency, not this repository's, and its
# stubs are a separate distribution. Used here only for `adjusted_rand_score`,
# which is a referee rather than a dependency of the package.
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `pandas-stubs` is a separate distribution, and the only pandas here builds
# a reference table for one dependency's interpolation. A development
# dependency for that is not the trade `CLAUDE.md` asks for.
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `aim` ships no type information, which `snakes_and_ladders` records for
# itself on sal #778. It is an optional extra here, so on the ordinary sync it
# is not installed at all and the only import of it -- inside
# `port.tracking.tracking` -- has nothing to resolve against either way.
module = "aim.*"
ignore_missing_imports = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# NB `release` is deselected by default and has to be asked for, as upstream
#    does: a bare `pytest` used to run the release tier, 288 s, and the
#    per-pull-request tier was a matter of remembering `-m "not release"`.
#    A later `-m` on the command line replaces this one, so `-m critical`
#    still means exactly `-m critical`, and the release gate passes
#    `-m "release or not release"`.
addopts = '--strict-markers -m "not release"'
markers = [
    # --- what a test is checked against; exactly one per test -------------
    #
    # #157. One axis, ten names, replacing the type/kind split #149 and #151
    # built. That split put `oracle` on both axes and `analytic` on one with
    # the opposite meaning it carried on the other, which is not a vocabulary
    # anyone can hold in their head.
    #
    # **Two count.** A statement is validated when a test judged a scientific
    # output against something outside `cnaster` -- the truth that generated
    # the data, or an independent implementation. Everything else is worth
    # having and is not validation: a property holds of a model nobody ran on
    # this instance, a patch agrees with the call it replaces without either
    # being right, a pinned defect says what is wrong rather than what works.
    "end2end: drives cnaster through a real path and judges scientific output against the truth that generated the data, to a stated tolerance",
    "oracle: judges scientific output against snakes_and_ladders as a second implementation, or against an exact independent answer -- enumeration, brute force, a closed form, a published value",
    # --- the rest, which do not count -------------------------------------
    "analytic: checked against a mathematical property the model must satisfy whatever the implementation does -- conservation, a limit, a symmetry, a monotonicity, a calibration",
    "patch: a port patch reproduces the cnaster call it replaces, bitwise or to a stated tolerance",
    "backend: the same kernel on another backend -- numpy, njit, Rust -- reproduced bitwise or to a stated tolerance",
    "bug: pins a defect against the paper, an oracle, or cnaster's own contract; written to fail when the defect is fixed",
    "warning: pins behaviour that is defensible but suspicious -- a shipped constant that asserts more than the data carries, a silent limit",
    "snapshot: pins current behaviour with no judgement attached, to be conserved",
    "smoke: checked against itself -- reachability, a shape, the absence of an exception, an invariant the implementation chose",
    # NB `infra` is deliberately few: port's own rules, not the subject's
    #    behaviour. A test that reaches `cnaster` at all is not infra, whatever
    #    it asserts -- it is `smoke` until something outside decides its value.
    "infra: port's own machinery and rules -- the marker guard, the planning-document check, the coverage scope, the upstream correspondence",
    # --- tiers: when a test runs, and how long it is allowed to take -----
    "release: over the per-pull-request budget; runs for a release",
    # NB `preprocessing` names a subject rather than a referee, as `release`
    #    and `benchmark` do. It selects the input path -- `load_input_data`,
    #    the binning, the pre-image that round-trips through them -- which is
    #    the stage whose failures are slowest to attribute and the one worth
    #    running alone while changing it.
    "preprocessing: exercises the input path from files to bins",
    # NB a benchmark measures rather than asserts, so it carries none of the
    #    ten: it has no expected value and nothing to be checked against.
    "benchmark: records a baseline; asserts no ratio",
    # NB `critical` is a second axis rather than one of the ten, and upstream
    #    states the rule this repository adopts: a test is critical *and*
    #    checked against something, never instead of it. What gates is a test
    #    whose referee is outside the implementation -- `end2end`, `oracle`,
    #    `analytic`, `patch` or `backend` -- and that carries no scale marker,
    #    so the early gate cannot silently become the slow tier.
    "critical: gates early; fast, and its failure means the rest is not worth running -- structurally, or because the science it rests on is wrong",
]



[tool.coverage.run]
# The subject is `cnaster`, so the denominator is `cnaster` rather than the
# modules a test happens to import. Naming the installed directory rather
# than the package is what makes coverage count the files it never loaded;
# naming the package counts only what ran, which reads as progress for
# importing less.
#
# What that denominator actually is, measured rather than assumed: the 37
# top-level modules, 5,544 statements. It is not every file the wheel
# ships. `cnaster` carries no `__init__.py` anywhere, so coverage's scan of
# a source *directory* does not descend into its subdirectories, and
# `scripts/` (4 modules) is outside the figure whatever `omit` says.
#
# `deprecated/` (19 modules) was outside it for the same reason, and is now
# outside the wheel as well. Dropping it moved the denominator by one
# statement, which is the measurement that proves it was never counted.
#
# For `deprecated/` that is the answer this repository wants and `omit`
# below states it on purpose. For `scripts/` it is a gap: those four modules
# are the console entry points the wheel installs, the most live code
# `cnaster` has, and the gate is silent about them. Closing it needs the
# subdirectory named as its own source root, and the floor recut against the
# larger denominator.
#
# `tests/test_coverage_scope.py` fails if this path stops being the
# installed package, so a Python version bump is a red test rather than a
# gate silently measuring a fraction of the subject.
source = [
    "python/port",
    ".venv/lib/python3.12/site-packages/cnaster",
]
# `deprecated/` and `sandbox/` are out of scope, so they are out of the
# denominator too. Leaving them in would hold the figure down with code no
# test will ever reach, which reads as an unvalidated subject rather than as
# a subject that was set aside.
#
# Both are no-ops today: neither subdirectory reaches the report in the
# first place, for the reason above. They are written down so that the
# exclusion is a decision rather than a side effect of a missing
# `__init__.py`, and so that naming `scripts/` as a source root later --
# which is what the gap above needs -- does not quietly pull `deprecated/`
# in with it.
omit = [
    "*/cnaster/deprecated/*",
    "*/cnaster/sandbox/*",
    # `sim.py` holds `load_tables_to_matrices` and nothing else, and its only
    # caller is commented out in `scripts/run_cnaster.py:58`. That is the
    # dependency setting a module aside in the only way a package with no
    # `deprecated/` directory can, so the rule above -- reachable from an
    # installed entry point -- resolves to no. #110.
    #
    # `wolff.py` **is** omitted as of #259, and it was not before. #110 kept
    # it in on the grounds that `run_cnaster` branches into
    # `initialize_clones_wolff` on a configuration key, so it was reachable
    # and only `ImportError` stopped it (#71). That is not what the branch
    # says. Measured on `cnaster`'s `port` branch:
    #
    #   * **0** modules in the package import it. `scripts/run_cnaster.py:62`
    #     and `hmrf.py:12` both comment theirs out.
    #   * the `initialize_clones_wolff(...)` call at `run_cnaster.py:257-273`
    #     is inside a triple-quoted string. No configuration key reaches it.
    #   * `import cnaster.wolff` raises, so no key could.
    #
    # So the rule above -- reachable from an installed entry point -- resolves
    # to no, exactly as it does for `sim.py`. 159 statements at 3.77 per cent,
    # holding the figure down with code nothing runs.
    #
    # #110's other reason was the real one: excluding it would hide a defect
    # behind a figure that improved. That is answered rather than ignored.
    # `test_the_sampling_module_does_not_import_and_nothing_notices` pins both
    # halves -- the `ImportError` by its message, and the importer count at
    # zero -- so the day either changes the test fails and this line comes
    # out. A defect pinned by a test is not a defect hidden by a denominator.
    "*/cnaster/sim.py",
    "*/cnaster/wolff.py",
]

[tool.coverage.report]
# **The floor is what `end2end` and `oracle` reach** (#157): 2,371 of 5,919
# statements, 40.06 per cent, over the 134 tests that judge a scientific
# output against the truth that generated the data or against an independent
# implementation. #160's first stage moved it: `normal_spot` went 0.00 to
# 14.25 per cent -- 56 statements that ran on every CI cycle with nothing
# checking the baseline every later stage divides by. Running everything reaches 4,242 of 6,218, 68.22 per cent,
# and that figure is no longer a gate.
#
# **Eight of the ten markers do not count, on purpose.** `analytic`, `patch`,
# `backend`, `bug`, `warning`, `snapshot`, `smoke` and `infra` are all worth
# having and none of them establishes that `cnaster` computed the right answer
# on an instance anyone ran: a mathematical property holds of a model, not of
# a run; a patch agrees with the call it replaces without either being right;
# a pinned defect says what is wrong rather than what works. #149 counted six
# of these and read 37.95; narrowing to two and correcting four round trips
# that judge planted truth reads 39.11, and the figure rose because the
# reclassification was worth more than the narrowing cost.
#
# The denominator used to move with the selection, 6,218 to 5,919, and the 299
# statements were exactly `scripts/run_cnaster.py`. That was the sharpest thing
# the split found: **the only tests that reached the installed entry point were
# ones this taxonomy does not count.** A directory scan did not descend into
# `scripts/` (the note above), so those statements entered the figure only when
# something imported the script -- and that was `test_run_cnaster_round_trip`
# and `test_cold_inference`, both `infra`. The end-to-end coverage #87 was
# credited with was real code executed and nothing judging the result.
#
# **#259 ended the split**, and not by a decision here: `cnaster`'s `port`
# branch ships `__init__.py`, the scan descends, and `scripts/` is in the
# denominator for every selection. The two guards now read one number, 8,514,
# and #223 -- which asked what the 299 were -- is answered by the arithmetic
# rather than by argument. What it does not answer is the gap the note above
# names: those 919 statements are the most live code `cnaster` has and they
# are at 0.00 per cent, counted now and still unjudged.
#
# The `port` side of the denominator: `port.integer_copy` 98 statements,
# `port.patch.hmrf_field` 32, `port.patch.hmrf_fused_field` 25,
# `port.patch.hmrf_adjacency` 9, `port.patch.hmrf_invariants` 28 and
# `port.patch.icm_interface` 40 (#56, #60-#64). Each moved the numerator and
# the denominator together, which is the arithmetic working.
#
# Low by construction -- the denominator is
# every module the package ships at top level, and most of them have no test
# yet. That is the point: the number says how much of the subject is
# validated, and it rises only by validating more of it.
#
# Measured with `-m "not release"`, the per-pull-request selection. The
# release-marked benchmarks add no statements of their own.
#
# Upstream's rule governs it: maintained or raised, never lowered to pass a
# pull request. Unlike a denominator of the imported modules, this one does
# not fall for bringing a new module under test.
#
# **#259 moved the denominator twice and the floor not at all.**
# `cnaster/scripts/` entered it -- 919 statements at 0.00 per cent, the four
# console entry points the `port` branch made scannable -- and `wolff.py`
# left it, 159 statements nothing can reach. The first alone would have taken
# the gate to 41.65 and forced a recut; the second is the scope rule above
# being applied rather than a rescue, and together they leave the gate clear
# of the floor it already had.
#
# The two are not interchangeable and the difference is the point: one is
# code the subject runs and nothing judges, which belongs in the denominator
# and is #260; the other is code the subject cannot run, which does not.
#
# **Every swap row costs this gate, and that is a property rather than a
# defect.** Measured on #259 stage 2, which replaced one method:
#
#     cnaster/hmm_nophasing.py    covered  191 -> 170   (-21)
#     port/patch/coded_emission   statements 0 -> 27, covered 24
#     gate                        42.44 -> 42.31
#
# **Stage 3 then ran the other way, and the reason is the same rule read
# forwards.** Replacing `_run_optimization_pipeline` outright added 149
# statements of `port` and the gate reads 42.71, because the replacement is
# installed by default: every fit in the counted selection runs it, so it
# joins at 82 per cent rather than at whatever its own `patch` tests reach. A
# swap row costs this gate when the counted selection does not exercise the
# replacement and pays when it does. Neither direction is a statement about
# `port`.
#
# **Stage 5 is the clearest case of that, because the flag decides it.** The
# derived gradient is off by default, so the counted selection never enters
# `em_gradient` (16.47 per cent, refereed by tests this gate does not count)
# and the gate fell 42.71 to 42.38. Defaulting the flag on would raise it and
# spend the bitwise reproduction claim `SWAPS` carries. That trade is not a
# coverage guard's to make, and this comment exists so nobody makes it here.
#
# The denominator is `cnaster`, so a body `port` replaces stops being
# exercised and a `port` module joins at whatever its own tests reach. The
# figure is not wrong: an unpatched user still runs the upstream body, and it
# is less validated than it was. It is simply not a progress metric for
# `port`, and it will fall again on every stage that lands a row. Do not
# "fix" it by counting the replacement as the replaced; that would make the
# guard report `port`'s coverage under `cnaster`'s name.
fail_under = 41.7
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
