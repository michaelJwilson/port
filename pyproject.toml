[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "port"
dynamic = ["version"]
description = ""
authors = [{ name = "M. J. Wilson" }]
license = "MIT"
requires-python = ">=3.12.2"
readme = "README.md"
dependencies = [
    "matplotlib>=3.9.0",
    "numba>=0.61.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.3",
    # Pulled from git, not PyPI -- see [tool.uv.sources] below, which pins it
    # to the `main` branch. Declaring it here is what makes that source entry
    # take effect; without it uv silently ignores the entry.
    "snakes_and_ladders",
    # Pulled from git, not PyPI -- see [tool.uv.sources] below, which pins it
    # to the `finish_annotation_mushift3` branch.
    "cnaster",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9,<0.10",
    "mypy>=1.15,<3",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7",
    "towncrier>=24.8.0",
    "types-PyYAML>=6.0",
]
docs = [
    "sphinx>=7,<9",
]
notebooks = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4",
    "pytest-xdist>=3.6",
]

[tool.uv.sources]
snakes_and_ladders = { git = "https://github.com/michaelJwilson/snakes_and_ladders", branch = "main" }
cnaster = { git = "https://github.com/michaelJwilson/cnaster", branch = "finish_annotation_mushift3" }

[tool.maturin]
python-source = "python"
module-name = "port.oxiport"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "G004",     # f-string in logger
  "T201",     # print statements
  "PLR2004",  # magic value in assert
  "ANN",      # annotation presence is enforced by mypy --strict, not ruff
  "PLR09",    # Too many <...>
  "ISC001",   # Conflicts with formatter
]

extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # literal expected values are the point of a regression test
  "ARG001",  # a fixture requested for its side effect is an unused argument
]

[tool.mypy]
strict = true
files = ["python", "tests"]

[[tool.mypy.overrides]]
module = "pytest_benchmark.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cnaster ships no py.typed marker, so --strict refuses every import of it.
# Narrowed to that package rather than relaxed globally: the tests score
# cnaster against a typed upstream, and silencing the upstream's types too
# would lose the half that is checkable.
module = "cnaster.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `scikit-learn` is `cnaster`'s dependency, not this repository's, and its
# stubs are a separate distribution. Used here only for `adjusted_rand_score`,
# which is a referee rather than a dependency of the package.
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `pandas-stubs` is a separate distribution, and the only pandas here builds
# a reference table for one dependency's interpolation. A development
# dependency for that is not the trade `CLAUDE.md` asks for.
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    # --- kinds: what decided the expected value -------------------------
    #
    # Every test names its referee (CLAUDE.md, Testing & Quality Assurance).
    # The kind is the referee, never the subject, and every test carries one
    # -- `tests/test_marker_discipline.py` refuses one that does not.
    #
    # `oracle` and `upstream_oracle` mirror `snakes_and_ladders`' vocabulary
    # and are kept apart because a closed form and a second implementation
    # are not the same witness: an exact answer cannot be wrong, and an
    # implementation agreeing with another can be wrong in the same way
    # twice. #69 is why the second one is named at all -- upstream is used
    # here in two roles, and only one of them referees.
    "oracle: checked against an independent exact answer -- enumeration, brute force, a closed form, or a published value",
    "upstream_oracle: checked against snakes_and_ladders as a second implementation of the same model -- agreement, to a stated tolerance, in a regime where the correspondence is established",
    "upstream: snakes_and_ladders was used and did not decide the value -- it drew the instance, or its acceptance of an input is itself the claim",
    "cnaster: checked against the cnaster implementation",
    "planted: checked against the fixture's planted truth",
    "analytic: checked against an analytic property or an invariant",
    # --- tiers: when a test runs, and how long it is allowed to take -----
    "release: over the per-pull-request budget; runs for a release",
    # NB `preprocessing` names a subject rather than a referee, as `release`
    #    and `benchmark` do. It selects the input path -- `load_input_data`,
    #    the binning, the pre-image that round-trips through them -- which is
    #    the stage whose failures are slowest to attribute and the one worth
    #    running alone while changing it.
    "preprocessing: exercises the input path from files to bins",
    "benchmark: records a baseline; asserts no ratio",
    # NB `critical` is a second axis rather than a kind, and upstream states
    #    the rule this repository adopts: a test is critical *and* refereed
    #    by something, never instead of it. What gates is a test whose
    #    referee is outside the implementation -- `oracle`, `upstream_oracle`,
    #    `cnaster` or `planted` -- and that carries no scale marker, so the
    #    early gate cannot silently become the slow tier.
    "critical: gates early; fast, and its failure means the rest is not worth running",
]

[tool.coverage.run]
# The subject is `cnaster`, so the denominator is `cnaster` rather than the
# modules a test happens to import. Naming the installed directory rather
# than the package is what makes coverage count the files it never loaded;
# naming the package counts only what ran, which reads as progress for
# importing less.
#
# What that denominator actually is, measured rather than assumed: the 37
# top-level modules, 5,544 statements. It is not every file the wheel
# ships. `cnaster` carries no `__init__.py` anywhere, so coverage's scan of
# a source *directory* does not descend into its subdirectories, and
# `scripts/` (4 modules) is outside the figure whatever `omit` says.
#
# `deprecated/` (19 modules) was outside it for the same reason, and is now
# outside the wheel as well. Dropping it moved the denominator by one
# statement, which is the measurement that proves it was never counted.
#
# For `deprecated/` that is the answer this repository wants and `omit`
# below states it on purpose. For `scripts/` it is a gap: those four modules
# are the console entry points the wheel installs, the most live code
# `cnaster` has, and the gate is silent about them. Closing it needs the
# subdirectory named as its own source root, and the floor recut against the
# larger denominator.
#
# `tests/test_coverage_scope.py` fails if this path stops being the
# installed package, so a Python version bump is a red test rather than a
# gate silently measuring a fraction of the subject.
source = [
    "python/port",
    ".venv/lib/python3.12/site-packages/cnaster",
]
# `deprecated/` and `sandbox/` are out of scope, so they are out of the
# denominator too. Leaving them in would hold the figure down with code no
# test will ever reach, which reads as an unvalidated subject rather than as
# a subject that was set aside.
#
# Both are no-ops today: neither subdirectory reaches the report in the
# first place, for the reason above. They are written down so that the
# exclusion is a decision rather than a side effect of a missing
# `__init__.py`, and so that naming `scripts/` as a source root later --
# which is what the gap above needs -- does not quietly pull `deprecated/`
# in with it.
omit = [
    "*/cnaster/deprecated/*",
    "*/cnaster/sandbox/*",
    # `sim.py` holds `load_tables_to_matrices` and nothing else, and its only
    # caller is commented out in `scripts/run_cnaster.py:58`. That is the
    # dependency setting a module aside in the only way a package with no
    # `deprecated/` directory can, so the rule above -- reachable from an
    # installed entry point -- resolves to no. #110.
    #
    # `wolff.py` is **not** omitted on the same argument, and #110 says why:
    # it is reachable, `run_cnaster` branches into `initialize_clones_wolff`
    # on a configuration key, and what stops it is `ImportError` at import
    # (#71). Excluding it would hide a defect behind a figure that improved.
    "*/cnaster/sim.py",
]

[tool.coverage.report]
# The floor the tests reach against the whole of `cnaster`: 3,254 of 5,843
# statements, 55.69 per cent. It was 33.77 until `run_cnaster` itself ran end
# to end from temporary files (#87): one call reaches the plotting, the
# phasing, the clone initializer, the normal baseline and the integer-copy
# solver, none of which any component test had touched.
#
# The denominator grew with it, 5,544 to 5,843, and the growth is the gap the
# note below predicted closing: `scripts/run_cnaster.py` is 299 statements
# that a directory scan never descended into, and importing it to run it puts
# them in the figure. They sit at 89.97 per cent.
#
# Low by construction -- the denominator is
# every module the package ships at top level, and most of them have no test
# yet. That is the point: the number says how much of the subject is
# validated, and it rises only by validating more of it.
#
# Measured with `-m "not release"`, the per-pull-request selection. The
# release-marked benchmarks add no statements of their own.
#
# Upstream's rule governs it: maintained or raised, never lowered to pass a
# pull request. Unlike a denominator of the imported modules, this one does
# not fall for bringing a new module under test, so there is no case where
# lowering it is legitimate.
fail_under = 66.9
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
