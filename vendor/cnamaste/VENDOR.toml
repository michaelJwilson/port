# `cnamaste`: `cnaster` at the pin `port` locks, renamed, with `port`'s
# default swaps folded in one table at a time (#392).
#
# `tests/vendor_cnamaste.py` reads this file. Stage 0 wrote the copy from it
# (`python -m tests.vendor_cnamaste`), and `tests/test_vendor_cnamaste.py`
# holds every module not listed under `folded` to the pin byte for byte.

# The `port.pipeline` tables folded in, in order. Each row's function is
# written into the module it replaced, with its helpers beside it, so the copy
# computes what `run_cnaster_port` computes with that table installed.
tables = ["SWAPS", "FIGURE_SWAPS", "SHIFT_SWAPS"]

[source]
url = "https://github.com/michaelJwilson/cnaster"
branch = "finish_annotation_mushift3"
commit = "4adad4d829ac58ac234685d71a8dbf26fd8ff3bb"

# Applied to every file's text in this order, and reversed to check it. None
# of the targets occurs at the pin, so the reversal is exact.
[[rename]]
old = "cnaster"
new = "cnamaste"

[[rename]]
old = "CNAster"
new = "CNAmaste"

# Paths relative to the package, pin -> copy.
[paths]
"scripts/run_cnaster.py" = "scripts/run_cnamaste.py"

# Out of scope by `CLAUDE.md`: work the source repository set aside.
[excluded]
trees = ["deprecated", "sandbox"]

# Deprecated rather than carried (#392).
[[dropped]]
entry = "run_cnaster_tumor_prop"
module = ""
why = "Its entry point names cnaster.scripts.run_cnaster_tumor_prop, which does not exist at the pin: the command fails on import."

[[dropped]]
entry = "prep_snps"
module = "scripts/prep_snps.py"
why = "Input preparation upstream of the model; no module of cnaster or port imports it."

[[dropped]]
entry = "create_allele_matrices"
module = "scripts/create_allele_matrices.py"
why = "Input preparation upstream of the model; no module of cnaster or port imports it."

[[dropped]]
entry = "run_sim_analysis"
module = ""
why = "The module is carried; the console script is not, because cnaster installs one of the same name beside it and the two would overwrite each other."

# Where each `port` module's code lives in the copy, for the imports the
# folded functions make. An import of the module a function now lives in is
# dropped: the names are its own globals.
[homes]
"port.patch.io" = "cnamaste.io"
"port.patch.reference" = "cnamaste.reference"
"port.patch.omics" = "cnamaste.omics"
"port.patch.omics.blocks" = "cnamaste.omics"
"port.patch.omics.summaries" = "cnamaste.omics"
"port.patch.spatial" = "cnamaste.spatial"
"port.patch.normal_spot" = "cnamaste.normal_spot"
"port.patch.hmrf.field" = "cnamaste.hmrf"
"port.patch.hmrf.fused_field" = "cnamaste.hmrf"
"port.patch.hmrf.adjacency" = "cnamaste.hmrf"
"port.patch.icm.interface" = "cnamaste.icm_interface"
"port.patch.plotting.clone_paths" = "cnamaste.clone_paths"
"port.patch.utils" = "cnamaste.utils"
"port.patch.plot_genomic" = "cnamaste.plot_genomic"
"port.patch.plotting" = "cnamaste.plotting"
"port.patch.plotting.spatial" = "cnamaste.plotting"
"port.patch.hmm_nophasing" = "cnamaste.hmm_nophasing"
"port.patch.hmm_nophasing.logmu_shift" = "cnamaste.hmm_nophasing"
"port.patch.hmm_nophasing.shifted_emission" = "cnamaste.hmm_nophasing"
"port.patch.hmrf" = "cnamaste.hmrf"
"port.patch.hmrf.core_inference" = "cnamaste.hmrf"


# Rows whose folded function is not `port`'s verbatim (renamed), and why.
[edited]
"cnamaste.hmrf:pipeline_clone_assignment" = "The label solver is the ICM alone: port's `--sal` choice of solver is an extension and stays in port. Delegation calls the kept original, `pipeline_clone_assignment_reference`, rather than a captured `UPSTREAM`."
"cnamaste.omics:assign_initial_blocks" = "Its delegation for a known segmentation calls the kept original, `assign_initial_blocks_reference`: port imports `cnaster`'s under the name `upstream`, which in the copy would be the function itself."

# Changes outside the rows themselves, and why.
[consequences]
"hmm_phased.py" = "Subclasses `hmm_nophasing_reference`: port's swap rebinds the name `hmm_nophasing` after `hmm_phased` was built on the original, so the phased class stays unshifted."
"hmm_nophasing.py" = "`hmm_nophasing.apply_logmu_shift = True` after the class: `run_cnaster_port` enters `logmu_shift()` for the whole run by default."

# Modules a stage has rewritten, with the table that did it. The provenance
# test skips them; the run test and the row test are what hold them.
[folded]
"hmm_nophasing.py" = "SHIFT_SWAPS"
"hmm_phased.py" = "SHIFT_SWAPS"
"hmrf.py" = "SWAPS"
"io.py" = "SWAPS"
"normal_spot.py" = "SWAPS"
"plot_genomic.py" = "FIGURE_SWAPS"
"plotting.py" = "FIGURE_SWAPS"
"omics.py" = "SWAPS"
"reference.py" = "SWAPS"
"spatial.py" = "SWAPS"
"utils.py" = "FIGURE_SWAPS"

# Modules with no counterpart at the pin, with the table that added them.
[added]
"clone_paths.py" = "SWAPS"
"icm_interface.py" = "SWAPS"
