name: Figures

# Regenerate every figure in docs/plots/ and commit it to the pull request's
# branch (#296): the dev instance's run_cnaster_port figures, and the
# realization figures, eight runs of one planted genome with the likelihood's
# errors (#291). The figures are a result, not a
# referee: a matplotlib PDF carries a creation timestamp, so every run differs
# byte for byte (#103), and nothing here compares them with the previous
# ones. What this guarantees is that the figures in a pull request are the
# figures its code draws. A branch another open pull request is based on is
# the exception: its figures are uploaded rather than committed (#350).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  figures:
    name: Figures (run_cnaster_port, dev instance)
    runs-on: ubuntu-latest
    # NB measured locally: the dev instance 54 s at a 4.25 GB peak (#304);
    #    the realizations eight runs of about 40 s, one process each, each
    #    peaking at 4.7 GB, run one at a time because a private repository's
    #    standard runner has 7 GB.
    timeout-minutes: 45
    permissions:
      # NB the only job in the repository that writes, and it writes only
      #    `docs/plots/`: the commit below stages that directory and nothing
      #    else, so no badge or coverage figure is ever written by CI and
      #    `check_badges`' refusal in ci.yml still means what it says.
      contents: write
      # NB to list the pull requests based on this branch (#350).
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # NB the branch itself, not the merge commit `pull_request` checks
          #    out by default, so there is something to push to.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --extra dev --extra test

      - run: uv run --no-sync python -m tests.generate_plots

      - run: uv run --no-sync python -m tests.realizations --realizations 8 --jobs 1

      # NB a branch another open pull request is based on is not committed
      #    to (#350): every PDF carries a timestamp (#103), so a commit here
      #    re-conflicts each child on docs/plots alone. Its figures are
      #    uploaded instead, and the child's own run commits its figures.
      - name: Is another pull request stacked on this branch
        id: stacked
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          children=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$HEAD" --state open --json number --jq 'length')
          echo "children=$children" >> "$GITHUB_OUTPUT"
          echo "$children open pull request(s) based on $HEAD"

      # NB a pull request from a fork gets a read-only token, so the figures
      #    are uploaded there instead of committed.
      - name: Commit the figures
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && steps.stacked.outputs.children == '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plots
          if git diff --cached --quiet; then
            echo "no figure changed"
            exit 0
          fi
          # NB a push with GITHUB_TOKEN starts no workflow run, so this
          #    cannot re-trigger itself.
          git commit -m "Regenerate docs/plots with run_cnaster_port (#296)"
          git push

      - name: Upload the figures
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || steps.stacked.outputs.children != '0')
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            docs/plots/*.pdf
            docs/plots/*.png
            docs/plots/*.npz
