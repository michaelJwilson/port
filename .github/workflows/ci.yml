name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NB stated rather than inherited. Every job here reads; only the badge report
#    below writes, and it writes a pull request comment rather than the
#    repository -- `check_badges` refuses a figure that moved and was never
#    written down, and a job that could push would make that refusal moot.
permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the badge report's one comment, upserted. Absent on a fork's pull
      # request, which is why that step degrades rather than fails.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; maturin compiles the crate on
      # install, so a toolchain is required even for the Python-only checks.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails rather than silently re-resolving, so a stale uv.lock
      # is caught here and not after a merge.
      - run: uv sync --locked --extra dev --extra test

      # NB one entry point, the one a contributor runs locally (#403): lint,
      #    types and the gate, then the two coverage guards and
      #    `check_badges`. The steps, their selections and their budgets are
      #    `tests/ci.py`'s; this file only calls it.
      - run: uv run --no-sync python -m tests.ci --gate --badges
      # NB what a pull request cannot otherwise say (#271). Every badge in
      #    `README.md` is pinned to `/main/.badges/`, so a branch renders
      #    main's figures and its own live only in a JSON diff. This renders
      #    the comparison the reviewer needs: base against head, delta first.
      #
      #    It reports and never gates. `check_badges` above is what fails the
      #    job on a figure that moved and was not written down, and it runs
      #    first so a report can never stand in for it.
      - name: Badge report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # A shallow fetch of the base is enough: only one file is read, and
          # `|| true` because a missing base is a case the report renders
          # rather than an error -- a first commit reaches it.
          git fetch --depth=1 origin "$BASE" || true
          git show FETCH_HEAD:.badges/measurements.json > /tmp/base-measurements.json || true

          uv run --no-sync python -m tests.badge_report \
            --base /tmp/base-measurements.json > /tmp/badge-report.md

          cat /tmp/badge-report.md >> "$GITHUB_STEP_SUMMARY"
      # NB one comment, upserted, because a comment per push is the noise the
      #    badges exist to avoid. Separate from the step above so the job
      #    summary still renders when no token can write -- a fork's pull
      #    request has none, and that is not a failure.
      - name: Badge report comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MARKER='<!-- badge-report -->'

          {
            echo "$MARKER"
            cat /tmp/badge-report.md
            echo
            echo "_Posted by the \`Badge report\` step of CI, and rewritten in place on each push._"
          } > /tmp/badge-comment.md

          # `--paginate` runs the filter once per page, so a repository with
          # enough comments to paginate can emit an id per page; take the
          # first and rewrite that one.
          EXISTING=$(gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | first | .id // empty" \
            | head -n 1)

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$EXISTING" \
              -F body=@/tmp/badge-comment.md
          else
            gh api "repos/$REPOSITORY/issues/$NUMBER/comments" \
              -F body=@/tmp/badge-comment.md
          fi

  # The release tier. `CLAUDE.md` says the release gate runs everything, and
  # until this job existed nothing did: `release` was a marker every job
  # deselected and no job selected, which is the "marker is documentation"
  # case it warns about. Runs on a version tag or by hand, never per pull
  # request -- the tier is minutes by design.
  release:
    name: Python (release tier)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra test
      # `-m` on the command line replaces `addopts`' `-m "not release"`, so
      # this is the whole suite: the per-pull-request tier and the release
      # tier together, as the release gate is defined.
      - run: uv run --no-sync pytest -m "(release or not release) and not oracle" -q --no-cov

  rust:
    name: Rust (lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
