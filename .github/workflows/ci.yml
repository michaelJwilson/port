name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; maturin compiles the crate on
      # install, so a toolchain is required even for the Python-only checks.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails rather than silently re-resolving, so a stale uv.lock
      # is caught here and not after a merge.
      - run: uv sync --locked --extra dev --extra test

      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      # NB the early gate, upstream's #237 read for this repository. It runs
      #    before the tier so a broken referee or a fixture that stopped
      #    planting what it claims surfaces in eight seconds rather than after
      #    the whole run. `--no-cov` because the floor in `pyproject.toml` is
      #    measured against the tier: the gate reaches 18.74 per cent of
      #    `cnaster` against the tier's 33.77, and applying the tier's floor
      #    to it would fail a passing gate.
      #
      #    91 tests in 7.80 s on the development host, against the tier's
      #    18.86 s. `tests/test_marker_discipline.py` is what keeps that ratio
      #    from drifting: the gate takes only a test refereed from outside the
      #    implementation and carrying no scale marker.
      - run: uv run --no-sync pytest -m critical -q --no-cov
      # NB the coverage gate is enforced here rather than in `addopts`, so a
      #    local `pytest` stays fast and the floor still binds on every change.
      #
      #    `-m "not release"` is what makes that marker mean anything. Without
      #    it the marker is documentation: `pyproject.toml` defines `release`
      #    as "over the per-pull-request budget", and the job ran the
      #    stress benchmarks it marks -- 78 seconds of them -- on every
      #    change. The floor is measured against this selection, and the
      #    release-marked tests contribute no statements of their own, so
      #    deselecting them does not move it.
      - run: uv run --no-sync pytest -m "not release" -q --no-cov
      # NB the gate measures the validated types alone (#149). Coverage counts
      #    what ran, so the counted set has to be the selection here rather
      #    than a filter applied to the full run afterwards -- which is also
      #    why the full suite runs first, above: every test still has to pass,
      #    counted or not.
      - run: >
          uv run --no-sync pytest
          -m "not release and (end2end or oracle)"
          --cov --cov-report=term
      # NB the referee's own floor, measured separately and over its own
      #    denominator. One figure covering both would rise for importing more
      #    of upstream, which is not validating more of the subject.
      #    `preprocessing` is deselected: the input path has no upstream
      #    referee, so those tests would dilute the oracle's denominator with
      #    work it was never asked to do.
      - run: >
          uv run --no-sync coverage run --rcfile=.coveragerc-oracle
          -m pytest -m "not release and not preprocessing" -q --no-cov
      - run: uv run --no-sync coverage report --rcfile=.coveragerc-oracle
      # NB the badges. `tests/test_badges_agree.py` already refuses a badge
      #    that disagrees with `.badges/measurements.json`; what it cannot
      #    catch is a measurement that moved and was never written down, so
      #    this reads the two coverage runs above and fails the job when the
      #    recorded figure is not the one just measured.
      #
      #    It refuses rather than commits. A job that rewrote the numbers and
      #    pushed would make the badges always correct and always unreviewed,
      #    which is the opposite of what a floor is for: a coverage change
      #    should arrive in a diff someone reads.
      - run: uv run --no-sync python -m tests.check_badges

  # The release tier. `CLAUDE.md` says the release gate runs everything, and
  # until this job existed nothing did: `release` was a marker every job
  # deselected and no job selected, which is the "marker is documentation"
  # case it warns about. Runs on a version tag or by hand, never per pull
  # request -- the tier is minutes by design.
  release:
    name: Python (release tier)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra test
      # `-m` on the command line replaces `addopts`' `-m "not release"`, so
      # this is the whole suite: the per-pull-request tier and the release
      # tier together, as the release gate is defined.
      - run: uv run --no-sync pytest -m "release or not release" -q --no-cov

  rust:
    name: Rust (lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
