name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NB stated rather than inherited. Every job here reads; only the badge report
#    below writes, and it writes a pull request comment rather than the
#    repository -- `check_badges` refuses a figure that moved and was never
#    written down, and a job that could push would make that refusal moot.
permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the badge report's one comment, upserted. Absent on a fork's pull
      # request, which is why that step degrades rather than fails.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; maturin compiles the crate on
      # install, so a toolchain is required even for the Python-only checks.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails rather than silently re-resolving, so a stale uv.lock
      # is caught here and not after a merge.
      - run: uv sync --locked --extra dev --extra test

      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      # NB the early gate, upstream's #237 read for this repository. It runs
      #    before the tier so a broken referee or a fixture that stopped
      #    planting what it claims surfaces in eight seconds rather than after
      #    the whole run. `--no-cov` because the floor in `pyproject.toml` is
      #    measured against the tier: the gate reaches 18.74 per cent of
      #    `cnaster` against the tier's 33.77, and applying the tier's floor
      #    to it would fail a passing gate.
      #
      #    91 tests in 7.80 s on the development host, against the tier's
      #    18.86 s. `tests/test_marker_discipline.py` is what keeps that ratio
      #    from drifting: the gate takes only a test refereed from outside the
      #    implementation and carrying no scale marker.
      #
      #    **The early gate keeps its `oracle` tests** while the rest of the
      #    disable holds (#282). Deselecting them here took it from 91 tests
      #    to 13, because most of what is `critical` is refereed against
      #    `snakes_and_ladders` -- which would leave the tripwire that exists
      #    to fail in eight seconds barely able to fail at all.
      - run: uv run --no-sync pytest -m critical -q --no-cov
      # NB the coverage gate is enforced here rather than in `addopts`, so a
      #    local `pytest` stays fast and the floor still binds on every change.
      #
      #    `-m "not release"` is what makes that marker mean anything. Without
      #    it the marker is documentation: `pyproject.toml` defines `release`
      #    as "over the per-pull-request budget", and the job ran the
      #    stress benchmarks it marks -- 78 seconds of them -- on every
      #    change. The floor is measured against this selection, and the
      #    release-marked tests contribute no statements of their own, so
      #    deselecting them does not move it.
      #
      #    **`oracle` is deselected, and that is a temporary disable (#282).** Every
      #    `and not oracle` in this file is one clause, added together and
      #    removable together; `.badges/measurements.json` records the guard
      #    it turned off and the figure it last read. 118 of 849 tests are
      #    `oracle`-marked and `CLAUDE.md` counts them as one of the two that
      #    validate anything, so this is a reduction in what CI establishes
      #    rather than a saving.
      - run: uv run --no-sync pytest -m "not release and not oracle" -q --no-cov
      # NB `cnamaste`'s own tests (#392): fixture based, blind to `cnaster` and
      #    `snakes_and_ladders`, and configured by `cnamaste/pyproject.toml`,
      #    which a path under `cnamaste/` selects. Its default deselects
      #    `release`, and benchmarks run once as tests. 40 tests in 70 s.
      - run: uv run --no-sync pytest cnamaste/tests -q
      # NB the gate measures the validated types alone (#149). Coverage counts
      #    what ran, so the counted set has to be the selection here rather
      #    than a filter applied to the full run afterwards -- which is also
      #    why the full suite runs first, above: every test still has to pass,
      #    counted or not.
      #
      #    The gate was `end2end or oracle` at the floor #157 decided. With
      #    `oracle` disabled the union is `end2end` alone, which is what this
      #    now selects -- and it is the badge's selection too, so the two
      #    steps are one while the disable holds. **The floor does not move**:
      #    `pyproject.toml` keeps 41.70 and `end2end` alone clears it by 1.86
      #    points. Restoring the guard restores the union and the second step.
      #
      #    `COVERAGE_FILE` keeps the data off `.coverage`, hyphenated so it is
      #    not read as a parallel shard and erased by a later `--cov` run.
      #    `tests/check_badges.py` reads this file.
      - run: >
          COVERAGE_FILE=.coverage-e2e uv run --no-sync pytest
          -m "not release and end2end"
          --cov --cov-report=term
      # NB **the oracle guard is disabled (#282).** It ran
      #    `coverage run --rcfile=.coveragerc-oracle -m pytest
      #    -m "not release and not preprocessing" -q --no-cov` followed by
      #    `coverage report --rcfile=.coveragerc-oracle`, measuring the
      #    referee's own reach over its own denominator so the figure could
      #    not rise by importing more of upstream.
      #
      #    `.coveragerc-oracle` and `tests/test_coverage_scope.py` stay, so
      #    the declared surface is still checked against what is installed
      #    and restoring the guard is these two lines and a figure.
      #    `tests/check_badges.py` skips a guard recorded with no percent, so
      #    nothing else here needed changing.
      # NB the badges. `tests/test_badges_agree.py` already refuses a badge
      #    that disagrees with `.badges/measurements.json`; what it cannot
      #    catch is a measurement that moved and was never written down, so
      #    this reads the two coverage runs above and fails the job when the
      #    recorded figure is not the one just measured.
      #
      #    It refuses rather than commits. A job that rewrote the numbers and
      #    pushed would make the badges always correct and always unreviewed,
      #    which is the opposite of what a floor is for: a coverage change
      #    should arrive in a diff someone reads.
      # NB guard 4: the drop-ins, against their own correspondence tests
      #    (#281). Guards 1-3 measure a dependency this repository does not
      #    own and are low by construction; this one measures code `port`
      #    wrote to replace something, under the tests that compare it with
      #    the something, so its floor is 90 rather than 41.70.
      #
      #    **`NUMBA_DISABLE_JIT` is what makes it measurable.** `CLAUDE.md`
      #    records that `numba` reports nothing, so an `@njit` kernel reads
      #    as uncovered however hard it is exercised -- 111 statements
      #    across four modules here. Running the kernels as Python makes
      #    them visible rather than excused: `patch/emission.py` went 55.56
      #    to 100 per cent without a test being added, and the step is
      #    *faster* for it, 38 s against 60, because nothing compiles.
      - run: >
          NUMBA_DISABLE_JIT=1 uv run --no-sync
          coverage run --rcfile=.coveragerc-dropin
          -m pytest -m "not release and (patch or cnaster)" -q --no-cov
      - run: uv run --no-sync coverage report --rcfile=.coveragerc-dropin
      - run: uv run --no-sync python -m tests.check_badges
      # NB what a pull request cannot otherwise say (#271). Every badge in
      #    `README.md` is pinned to `/main/.badges/`, so a branch renders
      #    main's figures and its own live only in a JSON diff. This renders
      #    the comparison the reviewer needs: base against head, delta first.
      #
      #    It reports and never gates. `check_badges` above is what fails the
      #    job on a figure that moved and was not written down, and it runs
      #    first so a report can never stand in for it.
      - name: Badge report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # A shallow fetch of the base is enough: only one file is read, and
          # `|| true` because a missing base is a case the report renders
          # rather than an error -- a first commit reaches it.
          git fetch --depth=1 origin "$BASE" || true
          git show FETCH_HEAD:.badges/measurements.json > /tmp/base-measurements.json || true

          uv run --no-sync python -m tests.badge_report \
            --base /tmp/base-measurements.json > /tmp/badge-report.md

          cat /tmp/badge-report.md >> "$GITHUB_STEP_SUMMARY"
      # NB one comment, upserted, because a comment per push is the noise the
      #    badges exist to avoid. Separate from the step above so the job
      #    summary still renders when no token can write -- a fork's pull
      #    request has none, and that is not a failure.
      - name: Badge report comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MARKER='<!-- badge-report -->'

          {
            echo "$MARKER"
            cat /tmp/badge-report.md
            echo
            echo "_Posted by the \`Badge report\` step of CI, and rewritten in place on each push._"
          } > /tmp/badge-comment.md

          # `--paginate` runs the filter once per page, so a repository with
          # enough comments to paginate can emit an id per page; take the
          # first and rewrite that one.
          EXISTING=$(gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | first | .id // empty" \
            | head -n 1)

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$EXISTING" \
              -F body=@/tmp/badge-comment.md
          else
            gh api "repos/$REPOSITORY/issues/$NUMBER/comments" \
              -F body=@/tmp/badge-comment.md
          fi

  # The release tier. `CLAUDE.md` says the release gate runs everything, and
  # until this job existed nothing did: `release` was a marker every job
  # deselected and no job selected, which is the "marker is documentation"
  # case it warns about. Runs on a version tag or by hand, never per pull
  # request -- the tier is minutes by design.
  release:
    name: Python (release tier)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra test
      # `-m` on the command line replaces `addopts`' `-m "not release"`, so
      # this is the whole suite: the per-pull-request tier and the release
      # tier together, as the release gate is defined.
      - run: uv run --no-sync pytest -m "(release or not release) and not oracle" -q --no-cov

  rust:
    name: Rust (lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
